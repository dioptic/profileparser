name: Build & publish PyPI packages

on:
  push:
    branches:
      - master
    tags:
      - v[0-9]+.**

jobs:
  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist package
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: packages-src
          path: "dist/*.tar.gz"

  build-win64-wheels:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: step-security/msvc-dev-cmd@v1
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel for python ${{ matrix.python-version }}
        run: |
          python -m pip install --upgrade pip build ninja
          python -m build --wheel
        env:
          CMAKE_GENERATOR: Ninja
      - uses: actions/upload-artifact@v7
        with:
          name: packages-win-py${{ matrix.python-version }}
          path: "dist/*.whl"

  build-linux-wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Linux wheels
        uses: pypa/cibuildwheel@v4.1.1
      - uses: actions/upload-artifact@v7
        with:
          name: packages-linux-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  pypi-publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    needs: [build-sdist, build-win64-wheels, build-linux-wheels]
    runs-on: ubuntu-latest
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    steps:
    - uses: actions/download-artifact@v6
      with:
        path: dist
        pattern: packages-*
        merge-multiple: true
    - name: Test PyPI publish
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        packages-dir: dist
        attestations: false
        skip-existing: true
    - name: PyPI publish
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist
